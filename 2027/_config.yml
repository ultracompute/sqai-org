title: "SQAI 2027"
preposition: "at"
description: >-
  4th International Summit on Quantum Artificial Intelligence — July 20-22, 2027.<br>
  Three tracks in one summit: SQAI-A (Academic Conference), SQAI-B (Industry Expo), and SQAI-C (Capital Summit — Washington, DC &amp; Taipei).<br>
  Hosted at National Taiwan University.

baseurl: "/2027"
url: "https://sqai.org"

theme: jekyll-theme-conference

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

conference:
  lang: en
  tz: "+08:00"
  show_errors: false

  navigation:
    breakpoint: md
    links:
      - name: Program
        name_zh: 議程
        relative_url: /program/
      - name: Sponsors
        name_zh: 贊助商
        relative_url: /sponsors/
      - name: CFP
        name_zh: 論文徵稿
        relative_url: /cfp/
      - name: Committee
        name_zh: 委員會
        relative_url: /committee/
      - name: Past Events
        name_zh: 歷屆活動
        menu:
          - name: Overview
            name_zh: 總覽
            absolute_url: "https://sqai.org/past/"
          - name: SQAI 2021
            name_zh: SQAI 2021
            absolute_url: "https://sqai.org/2021/"
          - name: SQAI 2023
            name_zh: SQAI 2023
            absolute_url: "https://sqai.org/2023/"
          - name: SQAI 2026
            name_zh: SQAI 2026
            absolute_url: "https://sqai.org/2026/"

    logo:
      name: ULTRACOMPUTE
      img: "uci_sqai.png"
      img_dark: "uci_sqai.png"
      url: "https://ultracompute.com"

  meta:
    schema_org:
      disable: false
      event_status: "scheduled"
      event_attendance_mode: "mixed"
      organizer:
        name: "ULTRACOMPUTE"
        url: "https://ultracompute.com"

  pwa:
    enable: false
