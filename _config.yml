title: "SQAI 2026"
preposition: "at"
description: >-
  3rd International Summit on Quantum Artificial Intelligence — August 10, 2026.
  Hosted by the Ultracompute Institute.<br>Free online access. In-person attendance available.

baseurl: ""
url: "https://sqai.org"

theme: jekyll-theme-conference

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

collections:
  talks:
    output: true
    permalink: /:collection/:title/
  speakers:
    output: true
    permalink: /:collection/:title/
  rooms:
    output: true
    permalink: /:collection/:title/

defaults:
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
  - scope:
      path: ""
      type: speakers
    values:
      layout: speaker
  - scope:
      path: ""
      type: rooms
    values:
      layout: room

conference:
  lang: en
  tz: "-04:00"
  show_errors: false

  navigation:
    breakpoint: md
    links:
      - name: Program
        name_zh: 議程
        relative_url: /program/
      - name: Sponsors
        name_zh: 贊助商
        relative_url: /sponsors/
      - name: CFP
        name_zh: 論文徵稿
        relative_url: /cfp/
      - name: Committee
        name_zh: 委員會
        relative_url: /committee/
      - name: Past Events
        name_zh: 歷屆活動
        relative_url: /past/
      - name: Register
        name_zh: 立即報名
        absolute_url: "https://forms.gle/VDxKKkNtufDJLS7D7"
        btn: true
    logo:
      name: Ultracompute Institute
      img: "uci_sqai.png"
      img_dark: "uci_sqai.png"
      url: "https://sqi.tw"

  meta:
    schema_org:
      disable: false
      event_status: "scheduled"
      event_attendance_mode: "mixed"
      organizer:
        name: "Ultracompute Institute"
        url: "https://sqi.tw"
      has_participation_offer:
        url: "https://forms.gle/VDxKKkNtufDJLS7D7"
      tickets:
        url: "https://forms.gle/VDxKKkNtufDJLS7D7"
        availability: "in_stock"

  talks:
    tracks:
      - name: Keynote
        color: primary
      - name: Research
        color: info
      - name: Industry
        color: success
    tags:
      - name: Online Access
        icon: globe

  pwa:
    enable: false
