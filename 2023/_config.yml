title: "SQAI 2023"
preposition: "at"
description: >-
  2nd Summit on Quantum Artificial Intelligence — May 7 to June 18, 2023.<br>
  A 7-week series of hands-on workshops and lectures on quantum computing and quantum AI.

baseurl: "/2023"
url: "https://sqai.org"

theme: jekyll-theme-conference

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

conference:
  lang: en
  tz: "-04:00"
  show_errors: false

  navigation:
    breakpoint: md
    links:
      - name: Past Events
        name_zh: 歷屆活動
        menu:
          - name: Overview
            name_zh: 總覽
            absolute_url: "https://sqai.org/past/"
          - name: SQAI 2021
            name_zh: SQAI 2021
            absolute_url: "https://sqai.org/2021/"
          - name: SQAI 2023
            name_zh: SQAI 2023
            absolute_url: "https://sqai.org/2023/"
          - name: SQAI 2026
            name_zh: SQAI 2026
            absolute_url: "https://sqai.org/2026/"
      - name: SQAI 2027 (Current)
        name_zh: SQAI 2027（本屆）
        absolute_url: "https://sqai.org/2027/"
        btn: true

    logo:
      name: ULTRACOMPUTE
      img: "uci_sqai.png"
      img_dark: "uci_sqai.png"
      url: "https://ultracompute.com"

  meta:
    schema_org:
      disable: false
      event_status: "scheduled"
      event_attendance_mode: "online"
      organizer:
        name: "ULTRACOMPUTE"
        url: "https://ultracompute.com"

  pwa:
    enable: false
